<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Doctors - Admin Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/admin/dashboard" class="navbar-brand">⚙️ Our Hospital - Admin Portal</a>

        <ul class="nav-links">
            <li><a href="/admin/dashboard">Dashboard</a></li>
            <li><a href="/admin/users">User Management</a></li>
            <li><a href="/admin/doctors">Doctor Management</a></li>
            <li><a href="/admin/vendors">Vendor Management</a></li>
            <li><a href="/admin/appointments">Appointments</a></li>
            <li><a href="/logout" class="btn btn-secondary btn-sm">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2>Hospital Specialist Doctors</h2>

        <div class="grid" style="margin-top: 1.5rem;">
            <div class="card" th:each="doc : ${doctors}">
                <div class="card-title" th:text="${doc.fullName}">Dr. Name</div>
                <p style="color: var(--primary-color); font-weight: 600;" th:text="${doc.email}">email@hospital.com</p>
                <div style="margin: 0.8rem 0; font-size: 0.9rem; color: var(--text-muted);">
                    <p><strong>Mobile:</strong> <span th:text="${doc.mobileNumber}">9876543210</span></p>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(doctors)}" style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">
                No doctors registered.
            </div>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
