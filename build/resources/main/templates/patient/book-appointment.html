<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment - Hospital Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/patient/dashboard" class="navbar-brand">🛡️ Our Hospital - Patient Portal</a>


        <ul class="nav-links">
            <li><a href="/patient/dashboard">Dashboard</a></li>
            <li><a href="/patient/doctors">Doctors</a></li>
            <li><a href="/patient/book-appointment">Book Appointment</a></li>
            <li><a href="/patient/appointments">My Appointments</a></li>
            <li><a href="/patient/profile">My Profile</a></li>
            <li><a href="/logout" class="btn btn-secondary btn-sm">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="auth-card" style="max-width: 600px;">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">📅 Book Doctor Appointment</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Select your preferred Doctor, Date, and Slot</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/patient/book-appointment}" method="post">
                <div class="form-group">
                    <label class="form-label">Select Specialist Doctor</label>
                    <select name="doctorId" class="form-control" required>
                        <option value="">-- Choose a Doctor --</option>
                        <option th:each="doc : ${doctors}"
                                th:value="${doc.id}"
                                th:selected="${selectedDoctorId != null && selectedDoctorId == doc.id}"
                                th:text="${doc.fullName + ' (' + doc.email + ')'}">Dr. Smith</option>
                    </select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Appointment Date</label>
                        <input type="date" name="appointmentDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Preferred Time Slot</label>
                        <input type="time" name="appointmentTime" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Reason for Consultation / Health Concerns</label>
                    <textarea name="reason" class="form-control" placeholder="Describe symptoms or reason for visit..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Submit Appointment Request</button>
            </form>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
