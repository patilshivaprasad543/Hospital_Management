<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vendor Profile - Hospital Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/vendor/dashboard" class="navbar-brand">🏢 Our Hospital - Vendor Portal</a>

        <ul class="nav-links">
            <li><a href="/vendor/dashboard">Dashboard</a></li>
            <li><a href="/vendor/profile">Vendor Profile</a></li>
            <li><a href="/logout" class="btn btn-secondary btn-sm">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="auth-card" style="max-width: 600px;">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">🏬 Vendor Business Profile</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Update your business name, contact info, and description</p>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/vendor/profile}" th:object="${profile}" method="post">
                <div class="form-group">
                    <label class="form-label">Vendor Business Name</label>
                    <input type="text" th:field="*{businessName}" class="form-control" placeholder="e.g. Apex Diagnostics Lab" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Vendor Category</label>
                    <select th:field="*{vendorType}" class="form-control">
                        <option value="LABORATORY">Laboratory / Lab Test Vendor</option>
                        <option value="PHARMACY">Pharmacy Vendor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Contact Phone / Helpline</label>
                    <input type="text" th:field="*{contactPhone}" class="form-control" placeholder="1800-123-456">
                </div>
                <div class="form-group">
                    <label class="form-label">Business Address</label>
                    <input type="text" th:field="*{address}" class="form-control" placeholder="Medical Hub, City">
                </div>
                <div class="form-group">
                    <label class="form-label">Description / Accreditations</label>
                    <textarea th:field="*{description}" class="form-control" placeholder="Describe offered lab services or pharmacy license details..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Save Business Details</button>
            </form>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
