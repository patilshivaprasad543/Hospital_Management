services:
  - type: web
    name: smartcare360
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SMARTCARE_APP_URL
        sync: false
      - key: SMARTCARE_ADMIN_EMAIL
        sync: false
      - key: SMARTCARE_ADMIN_PASSWORD
        sync: false
      - key: SMARTCARE_ADMIN_NAME
        value: System Administrator
      - key: SMARTCARE_ADMIN_MOBILE
        sync: false
      - key: SMARTCARE_MAIL_USERNAME
        sync: false
      - key: SMARTCARE_MAIL_PASSWORD
        sync: false
      - key: SMARTCARE_WHATSAPP_ENABLED
        value: "false"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: SMARTCARE_DB_URL
        value: jdbc:h2:file:/app/data/smartcare360;DB_CLOSE_DELAY=-1
