services:
  - type: web
    name: hospital-management-glt1-ge8d
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8085"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: System Admin
      - key: ADMIN_EMAIL
        value: admin@hospital.com
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
