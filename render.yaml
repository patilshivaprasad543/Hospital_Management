services:
  - type: web
    name: hospital-management-glt1-ge8d
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8085"
      - key: DB_HOST
        fromDatabase:
          name: hospital-management-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hospital-management-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: hospital-management-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: hospital-management-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hospital-management-db
          property: password
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: ADMIN_NAME
        value: System Admin
      - key: ADMIN_EMAIL
        value: admin@hospital.com
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"

databases:
  - name: hospital-management-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
