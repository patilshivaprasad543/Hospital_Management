services:
  - type: web
    name: hospital-management-glt1-ge8d
    runtime: docker
    # Paid Starter (0.5 CPU / 512 MB) keeps the API running continuously.
    # Render Free services sleep after 15 minutes without inbound traffic.
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Neon PostgreSQL credentials are intentionally not stored in Git.
      # Add these values in the Render dashboard.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: ADMIN_NAME
        value: System Admin
      - key: ADMIN_EMAIL
        value: admin@hospital.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
