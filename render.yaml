services:
  - type: web
    name: hospital-management-glt1-ge8d
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Neon PostgreSQL credentials are intentionally not stored in Git.
      # Add these three values in the Render dashboard:
      # SPRING_DATASOURCE_URL=jdbc:postgresql://<neon-host>/<database>?sslmode=require
      # SPRING_DATASOURCE_USERNAME=<neon-username>
      # SPRING_DATASOURCE_PASSWORD=<neon-password>
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: ADMIN_NAME
        value: System Admin
      - key: ADMIN_EMAIL
        value: admin@hospital.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
