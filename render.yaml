services:
  - type: web
    name: hospital-management-glt1-ge8d
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Neon is the external PostgreSQL provider. Render only hosts the Spring Boot service.
      # Set JDBC_DATABASE_URL in the Render dashboard to the JDBC connection string copied from Neon.
      - key: JDBC_DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: ADMIN_NAME
        value: System Admin
      - key: ADMIN_EMAIL
        value: admin@hospital.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
