# Render Blueprint — SmartCare 360 (Spring Boot / Java)
# IMPORTANT: Use runtime docker (NOT Node). If you see "Couldn't find package.json",
# delete the service and redeploy with Language = Docker, or use this Blueprint.
#
# Always-on: Render "free" sleeps after idle (~15 min) and shows "waking up".
# Change plan to "starter" (paid) in the Render dashboard for 24/7 uptime.
# Keep healthCheckPath at /health so Render and uptime pings stay cheap.

services:
  - type: web
    name: hospital-management-glt1
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: smartcare-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "8080"
      - key: SMARTCARE_APP_URL
        value: https://hospital-management-glt1.onrender.com
      - key: SMARTCARE_ADMIN_EMAIL
        value: admin@smartcare360.local
      - key: SMARTCARE_ADMIN_PASSWORD
        generateValue: true
      - key: SMARTCARE_ADMIN_NAME
        value: System Administrator
      - key: SMARTCARE_ADMIN_MOBILE
        value: "9999999999"
      - key: SMARTCARE_MAIL_USERNAME
        sync: false
      - key: SMARTCARE_MAIL_PASSWORD
        sync: false
      - key: SMARTCARE_MAIL_PROVIDER
        value: auto
      - key: SMARTCARE_BREVO_API_KEY
        sync: false
      - key: SMARTCARE_BREVO_SENDER_EMAIL
        sync: false
      - key: SMARTCARE_BREVO_SENDER_NAME
        value: SmartCare 360
      - key: SMARTCARE_WHATSAPP_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: smartcare360-db
          property: connectionString
      - key: SMARTCARE_DB_URL
        value: jdbc:h2:file:/app/data/smartcare360;DB_CLOSE_DELAY=-1

databases:
  - name: smartcare360-db
    plan: free
    region: singapore
    databaseName: smartcare360
    user: smartcare
