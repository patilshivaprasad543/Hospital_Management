services:
  - type: web
    name: hospital-management-glt1-ge8d
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Render provides PORT automatically. Do not hardcode it.
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-management-db
          property: connectionString
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: ADMIN_NAME
        value: System Admin
      - key: ADMIN_EMAIL
        value: admin@hospital.com
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"

databases:
  - name: hospital-management-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
