services:
  - type: web
    name: hospital-management-glt1-ge8d
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Database is hosted externally on Neon PostgreSQL.
      # Set these values in the Render dashboard using your Neon connection details.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: ADMIN_NAME
        value: System Admin
      - key: ADMIN_EMAIL
        value: admin@hospital.com
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
