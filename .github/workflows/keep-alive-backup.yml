# Secondary health check for SmartCare 360.
# The primary keep-alive workflow runs every 5 minutes.
name: SmartCare 360 Health Check Backup

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify Render health endpoint
        run: |
          set -euo pipefail
          URL="https://hospital-management-glt1-ge8d-a5jy.onrender.com"
          echo "Checking $URL/health"
          curl -L --fail --show-error --silent --max-time 300 \\
            -A "SmartCare360-HealthCheck-Backup/1.0" \\
            "$URL/health"
          echo
          echo "Backup health check passed."