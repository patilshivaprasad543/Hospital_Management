# External health check for the Render service.
# This workflow does not guarantee that a Render Free service stays awake.
name: Keep site live (backup)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check Render health endpoint
        run: |
          set -euo pipefail
          URL="https://hospital-management-glt1-ge8d.onrender.com"
          echo "Checking $URL/health"
          curl -L --fail --show-error --silent --max-time 300 \\
            -A "SmartCare360-KeepAlive-Backup/1.0" \\
            "$URL/health"
          echo
          echo "Render health check passed."