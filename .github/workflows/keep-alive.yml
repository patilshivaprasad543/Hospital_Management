name: SmartCare 360 Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake and verify Render service
        run: |
          set -euo pipefail
          URL="https://hospital-management-glt1-ge8d-a5jy.onrender.com"
          echo "Waking/checking SmartCare 360: $URL/health"
          curl -L --fail --show-error --silent --max-time 300 \\
            -A "SmartCare360-KeepAlive/1.0" \\
            "$URL/health"
          echo
          echo "SmartCare 360 health check passed."