# Keep Render Free awake. URL is hardcoded — no secrets and no extra GitHub permissions.
name: Keep site live

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping live site
        run: |
          set +e
          for url in \
            https://smartcare360.onrender.com \
            https://hospital-management.onrender.com
          do
            echo "Pinging $url"
            if curl -fsS --max-time 90 "$url/health" || curl -fsS --max-time 90 "$url/"; then
              echo "Reachable: $url"
              exit 0
            fi
          done
          echo "Host did not answer this run; next ping is in 5 minutes."
          exit 0
