# Backup health checks for the Render service.
# The service is configured as paid/always-on in render.yaml, so this workflow
# is no longer responsible for preventing sleep. It provides an external
# health check every 10 minutes and can expose a failed deployment quickly.
name: Hospital Management Health Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Render health endpoint
        run: |
          set -e
          URL="https://hospital-management-glt1-ge8d.onrender.com/health"
          echo "Checking $URL"
          curl --fail --show-error --silent --max-time 120 \
            -A "HospitalManagement-HealthCheck/1.0" \
            "$URL"
          echo
          echo "Health check passed."
