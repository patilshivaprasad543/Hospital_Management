# Ping the public site every 5 minutes so Render Free does not idle-sleep.
# Runs on GitHub's free runners (no Render paid plan required).
# Scheduled jobs only run after this file is on the repository default branch (main).

name: Keep site live

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/keep-alive.yml"
      - ".github/keep-alive-urls.txt"
      - "scripts/keep_alive.sh"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping live URLs
        env:
          SECRET_URL: ${{ secrets.SMARTCARE_APP_URL }}
          HOMEPAGE: ${{ github.event.repository.homepage }}
        run: bash scripts/keep_alive.sh
