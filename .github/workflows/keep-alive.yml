# Free 24/7 keep-alive for Render Free (no paid plan, no secrets, no extra permissions).
# GitHub only guarantees schedules about every 5 minutes; several crons cover delays.
name: Keep site live

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "1-59/5 * * * *"
    - cron: "2-59/5 * * * *"
    - cron: "3-59/5 * * * *"
    - cron: "4-59/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the Postgres live URL
        run: |
          set +e
          urls="
          https://hospital-management-glt1-ge8d.onrender.com
          "
          paths="/health /healthz /ping /keepalive /login /"
          for url in $urls; do
            [ -z "$url" ] && continue
            for path in $paths; do
              echo "GET $url$path"
              curl -fsS --max-time 90 -A "SmartCare360-KeepAlive" "$url$path" >/dev/null && echo "OK $url$path"
            done
          done
          exit 0
