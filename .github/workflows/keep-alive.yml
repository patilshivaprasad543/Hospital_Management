# Keeps the Render Free web service receiving traffic before its 15-minute idle window.
# Scheduled workflows can be delayed, so this reduces (but cannot absolutely eliminate) cold starts.
name: Keep Hospital Management API Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake and health-check Render service
        run: |
          set -e
          URL="https://hospital-management-glt1-ge8d.onrender.com/health"
          echo "Pinging $URL"
          curl --fail --show-error --silent --max-time 120 \
            -A "HospitalManagement-KeepAlive/1.0" \
            "$URL"
          echo
          echo "Keep-alive request completed."
