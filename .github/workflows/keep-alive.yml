# Ping the public site every 5 minutes so Render Free does not idle-sleep.
# Read-only token only — no approval, secrets, or extra GitHub permissions.
# Must live on main so the schedule runs.

name: Keep site live

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping live URLs
        env:
          SECRET_URL: ${{ secrets.SMARTCARE_APP_URL }}
          HOMEPAGE: ${{ github.event.repository.homepage }}
        run: bash scripts/keep_alive.sh
