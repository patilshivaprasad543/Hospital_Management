name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_build:
        description: 'Build Release APK (instead of Debug)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build SmartCare 360 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: ${{ !inputs.release_build }}
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: ${{ inputs.release_build }}
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p apk-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} apk-output/SmartCare360.apk \;

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCare360-APK
          path: apk-output/SmartCare360.apk
          retention-days: 30

      - name: Create GitHub Release (on Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/SmartCare360.apk
          name: SmartCare 360 Android App ${{ github.ref_name }}
          body: |
            ## SmartCare 360 Android App Download
            
            Download and install the latest `SmartCare360.apk` directly on your Android device:
            
            - **Package:** `com.smartcare360.app`
            - **Live Server:** https://hospital-management-glt1-ge8d.onrender.com
            
            ### How to Install:
            1. Download `SmartCare360.apk` below to your Android phone.
            2. Tap the downloaded file to install.
            3. If prompted, allow "Install from Unknown Sources".
            4. Launch SmartCare 360 and sign in!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
