plugins {
    id 'java'
    id 'war'
    id 'eclipse'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hospital'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ['-parameters']
}

eclipse {
    jdt {
        file {
            withProperties { properties ->
                properties['org.eclipse.jdt.core.compiler.codegen.methodParameters'] = 'generate'
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // =========================
    // SPRING BOOT & EMBEDDED/EXTERNAL TOMCAT
    // =========================

    // Spring Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Tomcat provided for External Servlet Container deployment
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring WebSocket (STOMP WebRTC Signaling & Chat)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Email
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // =========================
    // THYMELEAF
    // =========================

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // =========================
    // DATABASE
    // =========================

    // Database
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // =========================
    // PDF GENERATION
    // =========================

    // OpenPDF - provides com.lowagie.text.*
    implementation 'com.github.librepdf:openpdf:1.3.39'

    // =========================
    // DEVELOPMENT
    // =========================

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // =========================
    // TESTING
    // =========================

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Optional: Spring Security testing
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}