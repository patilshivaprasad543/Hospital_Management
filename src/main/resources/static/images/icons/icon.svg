<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Inner shield with subtle glow & shadow -->
  <path d="M256 70 L96 135 V280 C96 385 256 445 256 445 C256 445 416 385 416 280 V135 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#shadow)" />

  <!-- Medical Cross inside Shield -->
  <!-- Vertical bar -->
  <rect x="226" y="180" width="60" height="155" rx="14" fill="#2563EB" />
  <!-- Horizontal bar -->
  <rect x="178.5" y="227.5" width="155" height="60" rx="14" fill="#2563EB" />

  <!-- Green heartbeat / accent dot at center -->
  <circle cx="256" cy="257.5" r="16" fill="#10B981" />
</svg>
