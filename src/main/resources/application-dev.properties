# Local development profile — do not use for public deployment

smartcare.admin.email=${SMARTCARE_ADMIN_EMAIL:admin@smartcare360.com}
smartcare.admin.password=${SMARTCARE_ADMIN_PASSWORD:Admin@360}
smartcare.admin.name=${SMARTCARE_ADMIN_NAME:System Administrator}
smartcare.admin.mobile=${SMARTCARE_ADMIN_MOBILE:9999999999}

# Registration OTP email — auto uses Gmail SMTP when Brevo is not configured
smartcare.mail.provider=${SMARTCARE_MAIL_PROVIDER:auto}

smartcare.dev.expose-otp=false
spring.h2.console.enabled=true
spring.thymeleaf.cache=false
