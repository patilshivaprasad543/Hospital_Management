# Local MySQL / MariaDB (Eclipse or command line)
# Activate with: SPRING_PROFILES_ACTIVE=dev,mysql
# or Run Configuration "Hospital_Management_MySQL"

spring.datasource.url=${SMARTCARE_DB_URL:jdbc:mysql://localhost:3306/smartcare360?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=${SMARTCARE_DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SMARTCARE_DB_USERNAME:root}
spring.datasource.password=${SMARTCARE_DB_PASSWORD:}
spring.jpa.database-platform=${SMARTCARE_DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=false
spring.profiles.include=dev
