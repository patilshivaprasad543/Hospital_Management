<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head('patient.timeline.title')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: patient-nav}"></nav>

    <div class="container">
        <div class="page-header">
            <div class="page-header-content">
                <h1>Health Timeline</h1>
                <p>Unified chronological record of appointments, consultations, prescriptions, and lab reports</p>
            </div>
        </div>

        <div class="timeline">
            <div class="timeline-item" th:each="event : ${timelineEvents}">
                <span class="timeline-badge" th:classappend="${event.badgeClass}" th:text="${event.type}">TYPE</span>
                <div class="timeline-date" th:text="${#temporals.format(event.occurredAt, 'dd MMM yyyy, HH:mm')}">Date</div>
                <h3 th:text="${event.title}">Event Title</h3>
                <p th:text="${event.description}">Description</p>
            </div>
            <div th:if="${#lists.isEmpty(timelineEvents)}" class="table-empty" style="padding:2rem;">
                No health records yet. Book an appointment to start your medical journey.
            </div>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
