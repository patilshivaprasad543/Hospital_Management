<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: patient-nav}"></nav>

<div class="container">
        <div class="auth-card" style="max-width: 600px;">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">👤 Patient Profile</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Update your personal & medical details</p>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/patient/profile}" th:object="${profile}" method="post">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" th:value="${patient.fullName}" disabled readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" th:value="${patient.email}" disabled readonly>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Age</label>
                        <input type="number" th:field="*{age}" class="form-control" placeholder="30">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Blood Group</label>
                        <select th:field="*{bloodGroup}" class="form-control">
                            <option value="">Select</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Gender</label>
                        <select th:field="*{gender}" class="form-control">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Residential Address</label>
                    <input type="text" th:field="*{address}" class="form-control" placeholder="123 Street, City">
                </div>
                <div class="form-group">
                    <label class="form-label">Medical History / Allergies</label>
                    <textarea th:field="*{medicalHistory}" class="form-control" placeholder="Mention any chronic conditions, allergies, or ongoing medications..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Save Profile Updates</button>
            </form>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
