<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Appointments')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: patient-nav}"></nav>

    <div class="container">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="page-header">
            <div class="page-header-content">
                <h1>My Appointments</h1>
                <p>View, check in, cancel, or rate your consultations</p>
            </div>
            <div class="page-header-actions">
                <a href="/patient/book-appointment" class="btn btn-primary">Book Appointment</a>
            </div>
        </div>

        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Doctor</th>
                        <th>Date &amp; Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="app : ${appointments}">
                        <td th:text="${'#APP-' + app.id}">#APP-1</td>
                        <td th:text="${app.doctor.fullName}">Dr. Smith</td>
                        <td th:text="${app.appointmentDate + ' ' + app.appointmentTime}">Date</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${app.status.name() == 'CONFIRMED' ? 'badge-confirmed' : (app.status.name() == 'PENDING' ? 'badge-pending' : (app.status.name() == 'COMPLETED' ? 'badge-completed' : 'badge-rejected'))}"
                                  th:text="${app.status.label}">Pending</span>
                        </td>
                        <td>
                            <form th:if="${app.status.name() == 'CONFIRMED' && app.queueTicket == null}"
                                  th:action="@{/patient/check-in/{id}(id=${app.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-success btn-sm">Check-In</button>
                            </form>
                            <span th:if="${app.queueTicket != null}" class="badge badge-role" th:text="${'Ticket ' + app.queueTicket}">#A101</span>
                            <a th:if="${app.status.name() == 'CONFIRMED' || app.status.name() == 'PENDING'}"
                               th:href="@{/patient/appointments/{id}/pre-checkin(id=${app.id})}"
                               class="btn btn-success btn-sm" style="background:#10b981;border-color:#10b981;font-weight:600;">📋 Pre-Check-In</a>
                            <a th:if="${app.status.name() != 'COMPLETED' && app.status.name() != 'CANCELLED' && app.status.name() != 'REJECTED'}"
                               th:href="@{/patient/appointments/{id}/reschedule(id=${app.id})}" class="btn btn-secondary btn-sm">Reschedule</a>
                            <form th:if="${app.status.name() != 'COMPLETED' && app.status.name() != 'CANCELLED' && app.status.name() != 'REJECTED' && app.queueTicket == null}"
                                  th:action="@{/patient/appointments/{id}/cancel(id=${app.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Cancel this appointment?')">Cancel</button>
                            </form>
                        </td>
                        <td>
                            <span th:text="${app.reason}">Reason</span>
                            <div th:if="${app.status.name() == 'COMPLETED' && !feedbackSubmitted.contains(app.id)}" class="mt-1">
                                <form th:action="@{/patient/appointments/{id}/feedback(id=${app.id})}" method="post" class="feedback-form">
                                    <select name="rating" class="form-control" style="width:auto;display:inline-block;" required>
                                        <option value="">Rate</option>
                                        <option value="5">★★★★★</option>
                                        <option value="4">★★★★</option>
                                        <option value="3">★★★</option>
                                        <option value="2">★★</option>
                                        <option value="1">★</option>
                                    </select>
                                    <input type="text" name="comment" class="form-control" placeholder="Optional comment" style="width:160px;display:inline-block;">
                                    <button type="submit" class="btn btn-secondary btn-sm">Submit</button>
                                </form>
                            </div>
                            <span th:if="${feedbackSubmitted.contains(app.id)}" class="text-muted" style="font-size:0.85rem;">Rated ✓</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(appointments)}" class="table-empty">
                        <td colspan="6">No appointments booked yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
