<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Find Doctors')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: patient-nav}"></nav>

<div class="container">
        <h2 style="margin-bottom: 1.5rem;">Available Medical Specialists</h2>

        <div class="grid">
            <div class="card" th:each="doc : ${doctors}">
                <div class="card-title" th:text="${doc.fullName}">Dr. Name</div>
                <p style="color: var(--primary-color); font-weight: 600;" th:text="${doc.email}">Specialization</p>
                <div style="margin: 0.8rem 0; font-size: 0.9rem; color: var(--text-muted);">
                    <p><strong>Mobile:</strong> <span th:text="${doc.mobileNumber}">9876543210</span></p>
                </div>
                <a th:href="@{/patient/book-appointment(doctorId=${doc.id})}" class="btn btn-primary btn-sm" style="width: 100%; margin-top: 0.5rem;">Book Appointment</a>
            </div>
            <div th:if="${#lists.isEmpty(doctors)}" style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">
                No doctors currently registered in the system.
            </div>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
