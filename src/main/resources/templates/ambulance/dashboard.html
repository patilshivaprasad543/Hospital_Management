<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ambulance Fleet')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: role-nav}"></nav>

    <div class="container">
        <div class="page-header">
            <div class="page-header-content">
                <h1>Ambulance Fleet &amp; Dispatch Command</h1>
                <p>24x7 Emergency Fleet Tracking, Drivers &amp; Rapid Response Dispatch</p>
            </div>
        </div>

        <div class="grid">
            <div class="card stat-card">
                <div class="card-title">Available Ambulances</div>
                <div class="stat-number success">5</div>
            </div>
            <div class="card stat-card">
                <div class="card-title">En-Route Dispatches</div>
                <div class="stat-number warning">1</div>
            </div>
            <div class="card stat-card">
                <div class="card-title">On-Call Drivers</div>
                <div class="stat-number accent">6</div>
            </div>
            <div class="card stat-card">
                <div class="card-title">Completed Trips Today</div>
                <div class="stat-number">12</div>
            </div>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
