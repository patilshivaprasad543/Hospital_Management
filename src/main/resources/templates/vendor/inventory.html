<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inventory')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: vendor-nav}"></nav>
<div class="container">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="page-header">
            <div class="page-header-content">
                <h1>Medicine Inventory</h1>
                <p>Add medicines, update stock, and track batch/expiry.</p>
            </div>
        </div>

        <div class="alert alert-danger" th:if="${!#lists.isEmpty(lowStockItems)}">
            Low stock: <span th:each="item, iter : ${lowStockItems}"><span th:text="${item.itemName}">Med</span><span th:if="${!iter.last}">, </span></span>
        </div>
        <div class="alert" th:if="${!#lists.isEmpty(expiringItems)}" style="background:#fffbeb;color:#92400e;">
            Expiring / expired:
            <span th:each="item, iter : ${expiringItems}"><span th:text="${item.itemName}">Med</span><span th:if="${!iter.last}">, </span></span>
        </div>

        <div class="split-layout">
            <div class="card">
                <div class="card-title">Add Medicine</div>
                <form th:action="@{/vendor/pharmacy-item/add}" method="post" style="margin-top: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Medicine Name</label>
                        <input type="text" name="itemName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <input type="text" name="category" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Manufacturer</label>
                        <input type="text" name="manufacturer" class="form-control">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                        <div class="form-group">
                            <label class="form-label">Batch Number</label>
                            <input type="text" name="batchNumber" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Expiry Date</label>
                            <input type="date" name="expiryDate" class="form-control">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                        <div class="form-group">
                            <label class="form-label">Price (₹)</label>
                            <input type="number" step="0.01" name="price" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Quantity</label>
                            <input type="number" name="stockQuantity" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Add Medicine</button>
                </form>
            </div>

            <div>
                <h3 style="margin-bottom: 1rem;">Stock</h3>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Medicine</th>
                                <th>Category</th>
                                <th>Mfr / Batch</th>
                                <th>Expiry</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th>Update / Receive</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${pharmacyItems}">
                                <td th:text="${item.itemName}">Paracetamol</td>
                                <td th:text="${item.category}">Category</td>
                                <td>
                                    <div th:text="${item.manufacturer}">Mfr</div>
                                    <small th:text="${item.batchNumber}">Batch</small>
                                </td>
                                <td>
                                    <span th:text="${item.expiryDate}">date</span>
                                    <span th:if="${item.expired}" class="badge badge-pending">Expired</span>
                                    <span th:if="${item.nearExpiry and !item.expired}" class="badge">Near expiry</span>
                                </td>
                                <td>
                                    <span th:text="${item.stockQuantity}">100</span>
                                    <span th:if="${item.lowStock}" class="badge badge-pending">Low</span>
                                </td>
                                <td th:text="${'₹' + item.price}">₹35</td>
                                <td>
                                    <form th:action="@{/vendor/pharmacy-item/{id}/update(id=${item.id})}" method="post" style="margin-bottom:0.4rem;">
                                        <input type="hidden" name="itemName" th:value="${item.itemName}">
                                        <input type="hidden" name="category" th:value="${item.category}">
                                        <input type="hidden" name="manufacturer" th:value="${item.manufacturer}">
                                        <input type="hidden" name="batchNumber" th:value="${item.batchNumber}">
                                        <input type="hidden" name="expiryDate" th:value="${item.expiryDate}">
                                        <input type="hidden" name="description" th:value="${item.description}">
                                        <input type="number" step="0.01" name="price" th:value="${item.price}" class="form-control form-control-sm" style="width:90px;display:inline-block;" title="Price">
                                        <input type="number" name="stockQuantity" th:value="${item.stockQuantity}" class="form-control form-control-sm" style="width:80px;display:inline-block;" title="Set quantity">
                                        <button type="submit" class="btn btn-secondary btn-sm">Save</button>
                                    </form>
                                    <form th:action="@{/vendor/pharmacy-item/{id}/restock(id=${item.id})}" method="post" style="display:inline;">
                                        <input type="number" name="quantity" class="form-control form-control-sm" placeholder="+ qty" min="1" required style="width:80px;display:inline-block;">
                                        <button type="submit" class="btn btn-primary btn-sm">Receive</button>
                                    </form>
                                    <form th:action="@{/vendor/pharmacy-item/{id}/delete(id=${item.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(pharmacyItems)}">
                                <td colspan="7" style="text-align: center; color: var(--text-muted);">No medicines listed yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
