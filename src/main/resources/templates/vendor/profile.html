<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vendor Profile')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: vendor-nav}"></nav>

<div class="container">
        <div class="auth-card" style="max-width: 600px;">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">Pharmacy / Vendor Profile</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Manage name, license, hours, delivery area, and contact details</p>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/vendor/profile}" th:object="${profile}" method="post">
                <div class="form-group">
                    <label class="form-label">Vendor Business Name</label>
                    <input type="text" th:field="*{businessName}" class="form-control" placeholder="e.g. MediPlus Central Pharmacy" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Owner Name</label>
                    <input type="text" th:field="*{ownerName}" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Vendor Category</label>
                    <select th:field="*{vendorType}" class="form-control">
                        <option value="LABORATORY">Laboratory / Lab Test Vendor</option>
                        <option value="PHARMACY">Pharmacy Vendor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Contact Phone / Helpline</label>
                    <input type="text" th:field="*{contactPhone}" class="form-control" placeholder="1800-123-456">
                </div>
                <div class="form-group">
                    <label class="form-label">Business Address</label>
                    <input type="text" th:field="*{address}" class="form-control" placeholder="Medical Hub, City">
                </div>
                <div class="form-group">
                    <label class="form-label">License Number</label>
                    <input type="text" th:field="*{licenseNumber}" class="form-control">
                </div>
                <p th:if="${profile.licenseFileName != null}" class="form-hint">License on file: <span th:text="${profile.licenseFileName}">file</span></p>
                <div class="form-group">
                    <label class="form-label">Working Hours</label>
                    <input type="text" th:field="*{workingHours}" class="form-control" placeholder="Mon - Sat 08:00 AM - 10:00 PM">
                </div>
                <div class="form-group">
                    <label class="form-label">Delivery Area</label>
                    <input type="text" th:field="*{deliveryArea}" class="form-control" placeholder="Hospital campus and nearby pin codes">
                </div>
                <div class="form-group">
                    <label class="form-label">Description / Accreditations</label>
                    <textarea th:field="*{description}" class="form-control" placeholder="Describe offered lab services or pharmacy license details..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Save Business Details</button>
            </form>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
