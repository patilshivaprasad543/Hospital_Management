<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vendor Dashboard - Hospital Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/vendor/dashboard" class="navbar-brand">🏢 Our Hospital - Vendor Portal</a>

        <ul class="nav-links">
            <li><a href="/vendor/dashboard">Dashboard</a></li>
            <li><a href="/vendor/profile">Vendor Profile</a></li>
            <li><a href="/logout" class="btn btn-secondary btn-sm">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2>Vendor Portal Overview</h2>
        <p style="color: var(--text-muted);">Manage laboratory tests or pharmacy inventory</p>

        <div class="card" style="margin-top: 1.5rem;">
            <div class="card-title" th:text="${profile.businessName != null ? profile.businessName : vendor.fullName}">Vendor Business</div>
            <p><strong>Vendor Category:</strong> <span th:text="${profile.vendorType}">LABORATORY / PHARMACY</span></p>
            <p><strong>Contact Email:</strong> <span th:text="${vendor.email}">email@vendor.com</span></p>
            <a href="/vendor/profile" class="btn btn-primary" style="margin-top: 1rem;">Update Business Profile</a>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
