<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="notifications-content">
    <div class="container">
        <div class="page-header">
            <div class="page-header-content">
                <h1 th:text="#{patient.notifications.heading}">My Notifications</h1>
                <p th:text="#{patient.notifications.subtitle}">Updates about your appointments, prescriptions, lab reports, pharmacy orders, and billing.</p>
            </div>
        </div>

        <div class="grid">
            <div class="card" th:each="n : ${notifications}"
                 th:style="${n.read ? 'opacity: 0.85;' : 'border-left: 4px solid var(--primary-color);'}">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;">
                    <div class="card-title" th:text="${n.title}">Notification Title</div>
                    <span class="badge badge-role"
                          th:text="${n.category != null ? n.category.label : #messages.msg('patient.notifications.update')}">Category</span>
                </div>
                <p style="margin: 0.5rem 0;" th:text="${n.message}">Notification message details...</p>
                <div style="font-size: 0.8rem; color: var(--text-muted);"
                     th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, hh:mm a')}">Date Time</div>
                <a th:if="${n.linkUrl != null}" th:href="${n.linkUrl}" class="btn btn-outline btn-sm"
                   style="margin-top: 0.75rem;" th:text="#{common.view.details}">View Details</a>
            </div>

            <div th:if="${#lists.isEmpty(notifications)}"
                 style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 2rem;"
                 th:text="#{patient.notifications.empty}">
                You have no notifications yet.
            </div>
        </div>
    </div>
</th:block>
