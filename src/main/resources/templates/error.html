<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCare 360 — System Notice</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<nav class="navbar navbar-auth">
    <a href="/" class="navbar-brand">
        <span class="brand-text">Smart<span class="brand-accent">Care</span> 360</span>
    </a>
</nav>
<div class="container login-splash-wrapper">
    <div class="auth-card text-center" style="max-width:550px;">
        <h2 th:text="${status != null} ? ('System Notice (' + status + ')') : 'Something went wrong'">Something went wrong</h2>
        <p class="auth-subtitle my-3">
            An unexpected request error occurred. Please try navigating back or return to the main portal home page.
        </p>
        <div class="d-flex gap-2 justify-content-center mt-4">
            <a class="btn btn-primary" href="/">Home Page</a>
            <a class="btn btn-secondary" href="/login">Portal Sign In</a>
            <a class="btn btn-outline-secondary" href="/health">System Health</a>
        </div>
    </div>
</div>
</body>
</html>
