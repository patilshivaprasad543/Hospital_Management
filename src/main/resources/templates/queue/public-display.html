<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Live Queue Display | SmartCare 360</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { background: #0f172a; color: #fff; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .display-header { padding: 20px 40px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #38bdf8; }
        .display-body { flex: 1; padding: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .serving-card { background: #1e293b; border-radius: 20px; padding: 40px; text-align: center; border: 3px solid #10b981; display: flex; flex-direction: column; justify-content: center; }
        .serving-number { font-size: 8rem; font-weight: 900; color: #10b981; line-height: 1; margin: 20px 0; }
        .next-card { background: #1e293b; border-radius: 20px; padding: 30px; display: flex; flex-direction: column; }
        .next-list { font-size: 2.5rem; font-weight: 700; color: #38bdf8; display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="display-header">
        <h2>🏥 SMARTCARE 360 — LIVE QUEUE DISPLAY</h2>
        <div>
            <h4 style="margin:0;">Dr. <span th:text="${doctor != null ? doctor.fullName : 'All Hospital Doctors'}">Doctor Name</span></h4>
            <span class="text-info">Cardiology &amp; General Medicine</span>
        </div>
    </div>

    <div class="display-body">
        <div class="serving-card">
            <h3 class="text-uppercase text-light" style="letter-spacing:2px;">NOW SERVING</h3>
            <div id="nowServingText" class="serving-number">---</div>
            <h4>Please Proceed to Consultation Room</h4>
        </div>

        <div class="next-card">
            <h3 class="text-uppercase text-light" style="letter-spacing:2px;">UPCOMING QUEUE NUMBERS</h3>
            <div id="nextList" class="next-list">
                <div>---</div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const doctorId = /*[[${doctor != null ? doctor.id : 0}]]*/ 0;

        function refreshDisplay() {
            if (!doctorId) return;
            fetch(`/api/queue/display/${doctorId}`)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('nowServingText').innerText = d.nowServing;
                    const list = document.getElementById('nextList');
                    list.innerHTML = '';
                    if (d.nextQueueNumbers && d.nextQueueNumbers.length > 0) {
                        d.nextQueueNumbers.forEach(num => {
                            const div = document.createElement('div');
                            div.innerText = '🎟 ' + num;
                            list.appendChild(div);
                        });
                    } else {
                        list.innerHTML = '<div class="text-muted">No waiting patients</div>';
                    }
                });
        }
        refreshDisplay();

        // STOMP WebSocket Live Connection
        if (typeof SockJS !== 'undefined' && typeof Stomp !== 'undefined' && doctorId > 0) {
            try {
                const socket = new SockJS('/ws-video');
                const stompClient = Stomp.over(socket);
                stompClient.debug = null;
                stompClient.connect({}, () => {
                    stompClient.subscribe(`/topic/doctor/${doctorId}/queue`, refreshDisplay);
                    stompClient.subscribe(`/topic/public/queue`, refreshDisplay);
                });
            } catch (e) {
                console.log('WebSocket connection fallback', e);
            }
        }
    </script>
</body>
</html>
