<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Telemedicine Console | Hospital Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        .doctor-console { display: grid; grid-template-columns: 1fr 420px; gap: 15px; height: calc(100vh - 20px); padding: 10px; background: #0f172a; color: #fff; }
        .video-stage { position: relative; background: #1e293b; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .remote-video-box { flex: 1; width: 100%; height: 100%; position: relative; }
        .remote-video-box video { width: 100%; height: 100%; object-fit: cover; }
        .local-pip { position: absolute; bottom: 20px; right: 20px; width: 180px; height: 120px; background: #000; border: 2px solid #10b981; border-radius: 8px; overflow: hidden; z-index: 10; }
        .local-pip video { width: 100%; height: 100%; object-fit: cover; }
        .call-header { padding: 10px 20px; background: rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; }
        .call-controls { padding: 12px; background: rgba(0,0,0,0.6); display: flex; justify-content: center; gap: 15px; }
        .btn-ctrl { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; border: none; cursor: pointer; }
        .clinical-panel { background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow-y: auto; padding: 15px; gap: 15px; }
        .card-dark { background: #334155; border-radius: 8px; padding: 12px; }
    </style>
</head>
<body style="background:#0f172a;">
    <div class="doctor-console">
        <div class="video-stage">
            <div class="call-header">
                <div>
                    <h5 style="margin:0;">Patient: <span th:text="${appointment.patient.fullName}">Patient Name</span></h5>
                    <small class="text-muted">Appointment #<span th:text="${appointment.id}">101</span></small>
                </div>
                <div>
                    <span id="connectionStatus" class="badge bg-warning">Initializing...</span>
                    <button class="btn btn-sm btn-success ms-2" onclick="startCallSession()">▶ Start Call</button>
                </div>
            </div>

            <div class="remote-video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="local-pip">
                    <video id="localVideo" autoplay playsinline muted></video>
                </div>
            </div>

            <div class="call-controls">
                <button id="micBtn" class="btn-ctrl" style="background:#3b82f6;color:#fff;" onclick="toggleMic()">🎤</button>
                <button id="camBtn" class="btn-ctrl" style="background:#3b82f6;color:#fff;" onclick="toggleCam()">📷</button>
                <button class="btn-ctrl" style="background:#ef4444;color:#fff;" onclick="endConsultationSession()">📞 End</button>
            </div>
        </div>

        <div class="clinical-panel">
            <div class="card-dark">
                <h6 style="color:#38bdf8;margin-top:0;">📋 Patient Overview</h6>
                <p class="mb-1"><strong>Name:</strong> <span th:text="${appointment.patient.fullName}">John</span></p>
                <p class="mb-1"><strong>Email:</strong> <span th:text="${appointment.patient.email}">john@gmail.com</span></p>
                <p class="mb-1"><strong>Mobile:</strong> <span th:text="${appointment.patient.mobileNumber}">9876543210</span></p>
                <p class="mb-0" th:if="${patientProfile != null}">
                    <strong>Blood Group:</strong> <span th:text="${patientProfile.bloodGroup != null ? patientProfile.bloodGroup : 'N/A'}">O+</span> |
                    <strong>Allergies:</strong> <span th:text="${patientProfile.allergies != null ? patientProfile.allergies : 'None'}">None</span>
                </p>
            </div>

            <div class="card-dark">
                <h6 style="color:#38bdf8;margin-top:0;">🩺 Clinical Diagnosis & Prescription</h6>
                <form th:action="@{/consultation/save}" method="post">
                    <input type="hidden" name="appointmentId" th:value="${appointment.id}">
                    <div class="mb-2">
                        <label class="form-label text-light small">Symptoms & Complaint</label>
                        <textarea name="symptoms" class="form-control form-control-sm bg-dark text-light border-secondary" rows="2" th:text="${appointment.reason}">Reason</textarea>
                    </div>
                    <div class="mb-2">
                        <label class="form-label text-light small">Diagnosis</label>
                        <textarea name="diagnosis" class="form-control form-control-sm bg-dark text-light border-secondary" rows="2" required placeholder="Enter diagnosis..."></textarea>
                    </div>
                    <div class="mb-2">
                        <label class="form-label text-light small">Treatment & Prescription</label>
                        <textarea name="treatmentPlan" class="form-control form-control-sm bg-dark text-light border-secondary" rows="3" placeholder="Enter medicines, dosage, and duration..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm w-100">Save Consultation Record</button>
                </form>
            </div>

            <div class="card-dark" style="flex:1;display:flex;flex-direction:column;">
                <h6 style="color:#38bdf8;margin-top:0;">💬 In-Call Chat</h6>
                <div id="chatContainer" style="flex:1;overflow-y:auto;max-height:150px;display:flex;flex-direction:column;gap:6px;" class="mb-2">
                    <div class="chat-bubble" style="background:#475569;font-size:0.85rem;padding:4px 8px;border-radius:4px;">
                        System: Telemedicine session active.
                    </div>
                </div>
                <div style="display:flex;gap:6px;">
                    <input type="text" id="chatInput" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Message patient...">
                    <button class="btn btn-info btn-sm" onclick="sendChat()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/webrtc-consultation.js}"></script>
    <script th:inline="javascript">
        const appointmentId = /*[[${appointment.id}]]*/ 0;
        const roomId = /*[[${videoRoom.roomId}]]*/ '';
        const userId = /*[[${loggedInUser.id}]]*/ 0;
        const userName = /*[[${loggedInUser.fullName}]]*/ '';

        const engine = new WebRtcConsultationEngine({
            appointmentId: appointmentId,
            roomId: roomId,
            userId: userId,
            userName: userName,
            role: 'DOCTOR',
            localVideoId: 'localVideo',
            remoteVideoId: 'remoteVideo',
            statusElemId: 'connectionStatus'
        });

        async function init() {
            const ready = await engine.initMedia();
            if (ready) {
                engine.connectSignaling();
            }
        }
        init();

        function startCallSession() {
            fetch(`/api/video-consultations/${appointmentId}/start`, { method: 'POST' })
                .then(r => r.json())
                .then(d => {
                    engine.updateStatus('Doctor Started Call', 'success');
                    engine.makeOffer();
                });
        }

        function toggleMic() {
            const muted = engine.toggleAudio();
            document.getElementById('micBtn').style.background = muted ? '#ef4444' : '#3b82f6';
        }

        function toggleCam() {
            const off = engine.toggleVideo();
            document.getElementById('camBtn').style.background = off ? '#ef4444' : '#3b82f6';
        }

        function sendChat() {
            const input = document.getElementById('chatInput');
            engine.sendChatMessage(input.value);
            input.value = '';
        }

        function endConsultationSession() {
            if (confirm('End consultation and exit call?')) {
                fetch(`/api/video-consultations/${appointmentId}/end`, { method: 'POST' })
                    .then(() => {
                        engine.leaveCall();
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: 'CLOSE_VIDEO_MODAL' }, '*');
                        } else {
                            window.location.href = '/doctor/dashboard';
                        }
                    });
            }
        }
    </script>
</body>
</html>
