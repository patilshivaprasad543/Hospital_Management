<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: auth-nav}"></nav>

<div class="container">
        <h2>🔔 Smart Notification Center</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Real-time alerts for appointments, digital prescriptions, lab reports, and orders.</p>

        <div class="grid">
            <div class="card" th:each="n : ${notifications}" th:style="${n.read ? 'opacity: 0.75;' : 'border-left: 4px solid var(--primary-color);'}">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div class="card-title" th:text="${n.title}">Notification Title</div>
                    <span class="badge badge-role" th:text="${n.category}">CATEGORY</span>
                </div>
                <p style="margin: 0.5rem 0;" th:text="${n.message}">Notification message details...</p>
                <div style="font-size: 0.8rem; color: var(--text-muted);" th:text="${#temporals.format(n.createdAt, 'dd-MMM-yyyy HH:mm')}">Date Time</div>
            </div>

            <div th:if="${#lists.isEmpty(notifications)}" style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">
                No notifications recorded.
            </div>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
