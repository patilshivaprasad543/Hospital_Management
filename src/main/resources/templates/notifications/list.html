<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
    <nav th:if="${loggedInUser.role.name() == 'PATIENT'}" th:replace="~{fragments/layout :: patient-nav}"></nav>
    <nav th:if="${loggedInUser.role.name() == 'DOCTOR'}" th:replace="~{fragments/layout :: doctor-nav}"></nav>
    <nav th:if="${loggedInUser.role.name() == 'VENDOR'}" th:replace="~{fragments/layout :: vendor-nav}"></nav>
    <nav th:if="${loggedInUser.role.name() == 'ADMIN'}" th:replace="~{fragments/layout :: admin-nav}"></nav>

<div class="container">
        <div class="page-header">
            <div class="page-header-content">
                <h1>My Notifications</h1>
                <p>Updates about your appointments, prescriptions, lab reports, pharmacy orders, and billing.</p>
            </div>
        </div>

        <div class="grid">
            <div class="card" th:each="n : ${notifications}" th:style="${n.read ? 'opacity: 0.85;' : 'border-left: 4px solid var(--primary-color);'}">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;">
                    <div class="card-title" th:text="${n.title}">Notification Title</div>
                    <span class="badge badge-role" th:text="${n.category.label}">Category</span>
                </div>
                <p style="margin: 0.5rem 0;" th:text="${n.message}">Notification message details...</p>
                <div style="font-size: 0.8rem; color: var(--text-muted);" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, hh:mm a')}">Date Time</div>
                <a th:if="${n.linkUrl != null}" th:href="${n.linkUrl}" class="btn btn-outline btn-sm" style="margin-top: 0.75rem;">View Details</a>
            </div>

            <div th:if="${#lists.isEmpty(notifications)}" style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 2rem;">
                You have no notifications yet. Updates from your care team will appear here.
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
