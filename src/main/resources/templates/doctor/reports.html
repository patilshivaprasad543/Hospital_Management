<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reports')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: doctor-nav}"></nav>
    <div class="container">
        <h1>Appointment &amp; Statistics Reports</h1>
        <div class="grid">
            <div class="card stat-card"><div class="card-title">Pending</div><div class="stat-number warning" th:text="${pendingCount}">0</div></div>
            <div class="card stat-card"><div class="card-title">Accepted</div><div class="stat-number success" th:text="${acceptedCount}">0</div></div>
            <div class="card stat-card"><div class="card-title">Completed</div><div class="stat-number" th:text="${completedCount}">0</div></div>
            <div class="card stat-card"><div class="card-title">Cancelled / Rejected</div><div class="stat-number" th:text="${cancelledCount}">0</div></div>
            <div class="card stat-card"><div class="card-title">Paid earnings</div><div class="stat-number" th:text="${'₹' + earnings.totalEarned}">0</div></div>
        </div>
        <h3>All appointments</h3>
        <div class="table-container">
            <table class="table">
                <thead><tr><th>Date</th><th>Patient</th><th>Status</th></tr></thead>
                <tbody>
                    <tr th:each="app : ${appointments}">
                        <td th:text="${app.appointmentDate}">d</td>
                        <td th:text="${app.patient.fullName}">p</td>
                        <td th:text="${app.status.label}">s</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
