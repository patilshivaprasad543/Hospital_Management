<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile & Schedule')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: doctor-nav}"></nav>

    <div class="container">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="split-layout">
            <div class="card">
                <h3>Doctor Profile</h3>
                <p class="text-muted mb-2">Rating: <span class="rating-stars" th:text="${'★ ' + #numbers.formatDecimal(averageRating, 1, 1)}">★ 0.0</span> (<span th:text="${ratingCount}">0</span> reviews)</p>
                <form th:action="@{/doctor/profile}" th:object="${profile}" method="post">
                    <div class="form-group">
                        <label class="form-label">Doctor Name</label>
                        <input type="text" class="form-control" th:value="${doctor.fullName}" disabled readonly>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                        <div class="form-group">
                            <label class="form-label">Specialization</label>
                            <input type="text" th:field="*{specialization}" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Qualifications</label>
                            <input type="text" th:field="*{qualification}" class="form-control" required>
                        </div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                        <div class="form-group">
                            <label class="form-label">Experience (Years)</label>
                            <input type="number" th:field="*{experienceYears}" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Consultation Fee (₹)</label>
                            <input type="number" step="0.01" th:field="*{consultationFee}" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Weekly Availability (display)</label>
                        <input type="text" th:field="*{availabilitySchedule}" class="form-control" placeholder="Mon - Sat (09:00 - 17:00)">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Hospital / Clinic Name</label>
                        <input type="text" th:field="*{hospitalName}" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Hospital / Clinic Address</label>
                        <input type="text" th:field="*{clinicAddress}" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">License Number</label>
                        <input type="text" th:field="*{licenseNumber}" class="form-control">
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
                        <div class="form-group">
                            <label class="form-label">Working Days</label>
                            <input type="text" th:field="*{workingDays}" class="form-control" placeholder="MON,TUE,WED,THU,FRI,SAT">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Start Time</label>
                            <input type="time" th:field="*{workStartTime}" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">End Time</label>
                            <input type="time" th:field="*{workEndTime}" class="form-control">
                        </div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                        <div class="form-group">
                            <label class="form-label">Slot Duration (minutes)</label>
                            <input type="number" th:field="*{slotDurationMinutes}" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Max Appointments / Day</label>
                            <input type="number" th:field="*{maxAppointmentsPerDay}" class="form-control">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Save Profile &amp; Availability</button>
                </form>
            </div>

            <div class="card">
                <h3>Leave Management</h3>
                <p class="text-muted mb-2">Mark dates when you will be unavailable for appointments.</p>
                <form th:action="@{/doctor/leave/add}" method="post" class="mb-2">
                    <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:0.75rem;align-items:end;">
                        <div class="form-group" style="margin:0;">
                            <label class="form-label">Leave Date</label>
                            <input type="date" name="leaveDate" class="form-control" required>
                        </div>
                        <div class="form-group" style="margin:0;">
                            <label class="form-label">Reason</label>
                            <input type="text" name="reason" class="form-control" placeholder="Personal / Conference">
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm">Add Leave</button>
                    </div>
                </form>
                <div class="table-container">
                    <table class="table">
                        <thead><tr><th>Date</th><th>Reason</th><th></th></tr></thead>
                        <tbody>
                            <tr th:each="leave : ${upcomingLeaves}">
                                <td th:text="${leave.leaveDate}">Date</td>
                                <td th:text="${leave.reason != null ? leave.reason : '-'}">Reason</td>
                                <td>
                                    <form th:action="@{/doctor/leave/{id}/delete(id=${leave.id})}" method="post">
                                        <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(upcomingLeaves)}" class="table-empty"><td colspan="3">No upcoming leave marked.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
