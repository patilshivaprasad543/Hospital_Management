<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Hospital Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">🛡️ Our Hospital</a>


        <ul class="nav-links">
            <li><a href="/register">Register Account</a></li>
        </ul>
    </nav>

    <div class="container login-splash-wrapper">
        <div class="auth-card">
            <h2 style="text-align: center; margin-bottom: 0.4rem;">Welcome Back</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.8rem; font-size: 0.95rem;">Sign in to access your secure hospital portal</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.2rem;">
                    Sign In
                </button>
            </form>

            <p style="text-align: center; margin-top: 1.8rem; font-size: 0.9rem; color: var(--text-muted);">
                Don't have an account? <a href="/register" style="color: var(--primary-color); font-weight: 700; text-decoration: none;">Register Here</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 HospitalCare Management System. All Rights Reserved.</p>
    </footer>
</body>
</html>
