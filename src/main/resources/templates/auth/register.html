<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="auth-body">
    <nav th:replace="~{fragments/layout :: auth-nav}"></nav>

<div class="container login-splash-wrapper">
        <div class="auth-card-3d-splash" style="max-width: 540px;">
            <h2 style="text-align: center; margin-bottom: 0.4rem; color: var(--accent-color);">Create Account</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.8rem; font-size: 0.95rem;"
               th:if="${selectedPortalRole != null}"
               th:text="'Registering as ' + ${selectedPortalRole.label}">
                Register as Patient, Doctor, or Vendor
            </p>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.8rem; font-size: 0.95rem;"
               th:if="${selectedPortalRole == null}">
                Register as Patient, Doctor, or Vendor
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel" th:field="*{mobileNumber}" class="form-control" placeholder="9876543210" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select id="roleSelect" th:field="*{role}" class="form-control" onchange="toggleVendorType()" required>
                        <option th:each="r : ${roles}" th:value="${r}"
                                th:selected="${preselectedRole != null and preselectedRole == r}"
                                th:text="${r.name() == 'PATIENT' ? 'Patient' : (r.name() == 'DOCTOR' ? 'Doctor' : 'Vendor')}"></option>
                    </select>
                </div>

                <div class="form-group" id="vendorTypeGroup" style="display: none;">
                    <label class="form-label">Vendor Category</label>
                    <select name="selectedVendorType" id="vendorTypeSelect" class="form-control">
                        <option value="LABORATORY" th:selected="${preselectedVendorType != null and preselectedVendorType.name() == 'LABORATORY'}">Laboratory</option>
                        <option value="PHARMACY" th:selected="${preselectedVendorType != null and preselectedVendorType.name() == 'PHARMACY'}">Pharmacy</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.2rem;">Register &amp; Send OTP</button>
            </form>

            <p style="text-align: center; margin-top: 1.2rem; font-size: 0.85rem; color: var(--text-muted);">
                Admin accounts are pre-created. <a href="/login/admin" style="color: var(--accent-color);">Admin login</a>
            </p>
            <p style="text-align: center; margin-top: 0.8rem; font-size: 0.9rem; color: var(--text-muted);">
                Already have an account? <a href="/login" style="color: var(--accent-color); font-weight: 700; text-decoration: none;">Sign In</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SmartCare 360. All Rights Reserved.</p>
    </footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
