<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>
<body class="auth-body">
    <nav th:replace="~{fragments/layout :: auth-nav}"></nav>

<div class="container login-splash-wrapper">
        <div class="auth-card">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">Forgot Password</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">
                Enter your registered email. We will send a password reset OTP.
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Send Reset OTP</button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                <a href="/login" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Back to Login</a>
            </p>
        </div>
    </div>
</body>
</html>
