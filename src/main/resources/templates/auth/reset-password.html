<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - SmartCare 360</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">🏥 SmartCare 360</a>
    </nav>

    <div class="container login-splash-wrapper">
        <div class="auth-card">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">Reset Password</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">
                Enter the OTP from your email and choose a new password.
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/reset-password}" method="post">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" th:value="${resetEmail}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Reset OTP</label>
                    <input type="text" name="resetOtp" class="form-control" placeholder="6-digit OTP" maxlength="6" required>
                </div>
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" name="newPassword" class="form-control" placeholder="New password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Reset Password</button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                <a href="/login" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Back to Login</a>
            </p>
        </div>
    </div>
</body>
</html>
