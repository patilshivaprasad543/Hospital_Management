<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Verify Email')}"></head>
<body class="auth-body">
    <nav th:replace="~{fragments/layout :: auth-nav}"></nav>

<div class="container login-splash-wrapper">
        <div class="auth-card">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">🔒 Email OTP Verification</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">
                A 6-digit OTP has been sent to your registered email address.<br>
                <strong th:if="${userEmail != null}" th:text="${userEmail}" style="color: var(--cyan-accent);">you@email.com</strong>
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/verify-otp}" method="post">
                <input type="hidden" name="userId" th:value="${userId}" />
                <div class="form-group">
                    <label class="form-label" style="text-align: center;">Enter 6-Digit OTP Code</label>
                    <input type="text" name="otp" class="form-control" placeholder="••••••" maxlength="6"
                           style="text-align: center; font-size: 1.5rem; letter-spacing: 0.5rem; font-weight: 700;"
                           required autofocus autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Verify &amp; Activate Account</button>
            </form>

            <div style="text-align: center; margin-top: 1.2rem;">
                <a th:href="@{/resend-otp(userId=${userId})}"
                   style="color: var(--primary-color); font-weight: 600; font-size: 0.9rem; text-decoration: none;">
                    🔄 Didn't receive OTP? Resend to registered email
                </a>
            </div>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
