<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login Portal')}"></head>
<body class="portal-body">
    <nav th:replace="~{fragments/layout :: auth-nav}"></nav>

    <div class="container portal-wrapper">
        <div class="portal-header">
            <h1>Welcome to SmartCare 360</h1>
            <p>Select your role to access the hospital management portal</p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success portal-alert" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger portal-alert" th:text="${errorMessage}"></div>

        <div class="portal-grid">
            <a th:each="role : ${portalRoles}"
               th:href="@{/login/{r}(r=${#strings.toLowerCase(role.name())})}"
               class="portal-card"
               th:classappend="${'portal-card-' + #strings.toLowerCase(role.name())}">
                <div class="portal-card-icon" th:text="${role.icon}">👤</div>
                <h3 th:text="${role.label}">Role</h3>
                <p th:text="${role.description}">Description</p>
                <span class="portal-card-action">Sign In</span>
            </a>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
