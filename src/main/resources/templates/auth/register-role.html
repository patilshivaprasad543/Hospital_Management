<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="auth-body">
    <nav th:replace="~{fragments/layout :: auth-nav}"></nav>

<div class="container login-splash-wrapper">
        <div class="auth-card portal-login-card" style="max-width: 540px;">
            <div class="portal-login-badge">
                <span th:text="${portalRole.icon}">👤</span>
                <span th:text="${portalRole.label + ' Registration'}">Patient Registration</span>
            </div>

            <h2 style="text-align: center; margin-bottom: 0.4rem;">Create Account</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.8rem; font-size: 0.95rem;">
                Fill in your details. We will send a 6-digit OTP to activate your account.
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/register/{r}(r=${portalRole.pathSegment})}" th:object="${user}" method="post">
                <input type="hidden" th:field="*{role}" />
                <input type="hidden" name="selectedVendorType" th:if="${portalRole.name() == 'VENDOR'}" value="LABORATORY" />
                <input type="hidden" name="selectedVendorType" th:if="${portalRole.name() == 'PHARMACY'}" value="PHARMACY" />

                <div th:if="${portalRole.name() == 'PHARMACY' or portalRole.name() == 'VENDOR'}">
                    <div class="form-group">
                        <label class="form-label" th:text="${portalRole.name() == 'PHARMACY'} ? 'Pharmacy / Business Name' : 'Business Name'">Pharmacy Name</label>
                        <input type="text" name="businessName" class="form-control" placeholder="MediPlus Central Pharmacy" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Owner Name</label>
                        <input type="text" th:field="*{fullName}" class="form-control" placeholder="Owner full name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Business Address</label>
                        <input type="text" name="address" class="form-control" placeholder="Shop / hospital block, city" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" th:text="${portalRole.name() == 'PHARMACY'} ? 'Pharmacy License Number' : 'Business License Number'">License Number</label>
                        <input type="text" name="licenseNumber" class="form-control" placeholder="License / GST number">
                    </div>
                    <div th:if="${portalRole.name() == 'PHARMACY'}" class="form-group">
                        <label class="form-label">Working Hours</label>
                        <input type="text" name="workingHours" class="form-control" placeholder="Mon-Sat 8:00 AM - 10:00 PM">
                    </div>
                    <div th:if="${portalRole.name() == 'PHARMACY'}" class="form-group">
                        <label class="form-label">Delivery Area</label>
                        <input type="text" name="deliveryArea" class="form-control" placeholder="Hospital campus and nearby pin codes">
                    </div>
                </div>
                <div th:if="${portalRole.name() != 'PHARMACY' and portalRole.name() != 'VENDOR'}" class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="you@example.com" required>
                    <small style="color: var(--text-muted); font-size: 0.8rem;">OTP will be sent to this email</small>
                </div>
                <div class="form-group">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel" th:field="*{mobileNumber}" class="form-control" placeholder="9876543210" required>
                </div>
                <div th:if="${portalRole.name() == 'PATIENT'}" class="form-group">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" name="dateOfBirth" class="form-control">
                </div>
                <div th:if="${portalRole.name() == 'PATIENT'}" class="form-group">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-control">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div th:if="${portalRole.name() == 'PATIENT'}" class="form-group">
                    <label class="form-label">Address</label>
                    <input type="text" name="address" class="form-control" placeholder="House no, street, city">
                </div>
                <div th:if="${portalRole.name() == 'DOCTOR'}">
                    <div class="form-group">
                        <label class="form-label">Specialization</label>
                        <input type="text" name="specialization" class="form-control" placeholder="Cardiology" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Qualification</label>
                        <input type="text" name="qualification" class="form-control" placeholder="MBBS, MD" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Experience (years)</label>
                        <input type="number" name="experienceYears" class="form-control" min="0" value="1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Hospital / Clinic Name</label>
                        <input type="text" name="hospitalName" class="form-control" placeholder="SmartCare 360 Hospital">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Hospital / Clinic Address</label>
                        <input type="text" name="clinicAddress" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Medical License Number</label>
                        <input type="text" name="licenseNumber" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.2rem;">
                    Register &amp; Send OTP
                </button>
            </form>

            <p style="text-align: center; margin-top: 1.8rem; font-size: 0.9rem; color: var(--text-muted);">
                Already registered?
                <a th:href="@{/login/{r}(r=${portalRole.pathSegment})}"
                   style="color: var(--primary-color); font-weight: 700; text-decoration: none;">Sign In with your credentials</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SmartCare 360. All Rights Reserved.</p>
    </footer>
</body>
</html>
