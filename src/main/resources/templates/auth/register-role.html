<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="auth-body">
    <nav th:replace="~{fragments/layout :: auth-nav}"></nav>

<div class="container login-splash-wrapper">
        <div class="auth-card portal-login-card" style="max-width: 540px;">
            <div class="portal-login-badge">
                <span th:text="${portalRole.icon}">👤</span>
                <span th:text="${portalRole.label + ' Registration'}">Patient Registration</span>
            </div>

            <h2 style="text-align: center; margin-bottom: 0.4rem;">Create Account</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.8rem; font-size: 0.95rem;">
                Fill in your details. A verification code will be sent to your email address.
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/register/{r}(r=${portalRole.pathSegment})}" th:object="${user}" method="post">
                <input type="hidden" th:field="*{role}" />
                <input type="hidden" name="selectedVendorType" th:if="${portalRole.name() == 'VENDOR'}" value="LABORATORY" />
                <input type="hidden" name="selectedVendorType" th:if="${portalRole.name() == 'PHARMACY'}" value="PHARMACY" />

                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="you@example.com" required>
                    <small style="color: var(--text-muted); font-size: 0.8rem;">Verification code will be sent to this email</small>
                </div>
                <div class="form-group">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel" th:field="*{mobileNumber}" class="form-control" placeholder="9876543210" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.2rem;">
                    Register &amp; Continue
                </button>
            </form>

            <p style="text-align: center; margin-top: 1.8rem; font-size: 0.9rem; color: var(--text-muted);">
                Already registered?
                <a th:href="@{/login/{r}(r=${portalRole.pathSegment})}"
                   style="color: var(--primary-color); font-weight: 700; text-decoration: none;">Sign In with your credentials</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SmartCare 360. All Rights Reserved.</p>
    </footer>
</body>
</html>
