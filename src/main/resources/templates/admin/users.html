<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users - Admin Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/admin/dashboard" class="navbar-brand">⚙️ Our Hospital - Admin Portal</a>

        <ul class="nav-links">
            <li><a href="/admin/dashboard">Dashboard</a></li>
            <li><a href="/admin/users">User Management</a></li>
            <li><a href="/admin/doctors">Doctor Management</a></li>
            <li><a href="/admin/vendors">Vendor Management</a></li>
            <li><a href="/admin/appointments">Appointments</a></li>
            <li><a href="/logout" class="btn btn-secondary btn-sm">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <h2>User & Role Management</h2>
        
        <div class="table-container" style="margin-top: 1.5rem;">
            <table class="table">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Role</th>
                        <th>Verified</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usr : ${users}">
                        <td th:text="${usr.id}">1</td>
                        <td th:text="${usr.fullName}">Name</td>
                        <td th:text="${usr.email}">email@example.com</td>
                        <td th:text="${usr.mobileNumber}">9876543210</td>
                        <td><span class="badge badge-role" th:text="${usr.role}">ROLE</span></td>
                        <td>
                            <span class="badge" th:classappend="${usr.verified ? 'badge-confirmed' : 'badge-pending'}" th:text="${usr.verified ? 'VERIFIED' : 'PENDING'}">VERIFIED</span>
                        </td>
                        <td>
                            <form th:if="${usr.role.name() != 'ADMIN'}" th:action="@{/admin/user/{id}/delete(id=${usr.id})}" method="post">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this user?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
