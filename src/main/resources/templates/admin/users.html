<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Patients')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: admin-nav}"></nav>

<div class="container">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <h2>Patients</h2>
        
        <div class="table-container" style="margin-top: 1.5rem;">
            <table class="table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Account Type</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usr : ${users}">
                        <td th:text="${usr.fullName}">Name</td>
                        <td th:text="${usr.email}">email@example.com</td>
                        <td th:text="${usr.mobileNumber}">9876543210</td>
                        <td><span class="badge badge-role" th:text="${usr.role.label}">Patient</span></td>
                        <td>
                            <span class="badge" th:classappend="${usr.verified ? 'badge-confirmed' : 'badge-pending'}" th:text="${usr.verified ? 'Verified' : 'Pending verification'}">Verified</span>
                        </td>
                        <td>
                            <form th:if="${usr.role.name() != 'ADMIN'}" th:action="@{/admin/user/{id}/delete(id=${usr.id})}" method="post">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this user?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
