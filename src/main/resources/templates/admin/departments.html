<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Departments')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: admin-nav}"></nav>

<div class="container">
        <h2>Hospital Departments</h2>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="auth-card" style="max-width:560px;margin-bottom:2rem;">
            <h3>Add Department</h3>
            <form th:action="@{/admin/departments}" method="post">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Add Department</button>
            </form>
        </div>

        <div class="table-container">
            <table class="table">
                <thead><tr><th>Name</th><th>Description</th><th>Status</th></tr></thead>
                <tbody>
                    <tr th:each="d : ${departments}">
                        <td th:text="${d.name}">Dept</td>
                        <td th:text="${d.description}">Desc</td>
                        <td><span class="badge badge-confirmed" th:text="${d.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
