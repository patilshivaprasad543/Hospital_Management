<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Appointments')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: admin-nav}"></nav>

<div class="container">
        <h2>Hospital-Wide Appointments Registry</h2>
        
        <div class="table-container" style="margin-top: 1.5rem;">
            <table class="table">
                <thead>
                    <tr>
                        <th>Appointment ID</th>
                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Created At</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="app : ${appointments}">
                        <td th:text="${'#APP-' + app.id}">#1</td>
                        <td th:text="${app.patient.fullName}">Patient</td>
                        <td th:text="${app.doctor.fullName}">Doctor</td>
                        <td th:text="${app.appointmentDate}">2026-08-20</td>
                        <td th:text="${app.appointmentTime}">10:00 AM</td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${app.status.name() == 'CONFIRMED' ? 'badge-confirmed' : (app.status.name() == 'PENDING' ? 'badge-pending' : 'badge-rejected')}"
                                  th:text="${app.status.label}">Status</span>
                        </td>
                        <td th:text="${#temporals.format(app.createdAt, 'dd-MMM-yyyy HH:mm')}">Time</td>
                        <td><a th:href="@{/admin/appointment/{id}/pdf(id=${app.id})}" class="btn btn-secondary btn-sm">PDF</a></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(appointments)}">
                        <td colspan="8" style="text-align: center; color: var(--text-muted);">No appointments recorded.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
