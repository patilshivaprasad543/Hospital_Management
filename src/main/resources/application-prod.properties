# Production profile — admin env vars optional; first boot generates them onto the data disk.

server.port=${PORT:8080}

smartcare.admin.email=${SMARTCARE_ADMIN_EMAIL:}
smartcare.admin.password=${SMARTCARE_ADMIN_PASSWORD:}
smartcare.admin.name=${SMARTCARE_ADMIN_NAME:System Administrator}
smartcare.admin.mobile=${SMARTCARE_ADMIN_MOBILE:9999999999}

smartcare.app.base-url=${SMARTCARE_APP_URL:}
smartcare.keepalive.enabled=${SMARTCARE_KEEPALIVE_ENABLED:true}
smartcare.keepalive.interval-ms=${SMARTCARE_KEEPALIVE_INTERVAL_MS:180000}
smartcare.dev.expose-otp=false

# Registration OTP: auto tries Brevo (HTTPS) then Gmail SMTP
smartcare.mail.provider=${SMARTCARE_MAIL_PROVIDER:auto}
smartcare.mail.brevo.api-key=${SMARTCARE_BREVO_API_KEY:}
smartcare.mail.brevo.sender-email=${SMARTCARE_BREVO_SENDER_EMAIL:}
smartcare.mail.brevo.sender-name=${SMARTCARE_BREVO_SENDER_NAME:SmartCare 360}

spring.mail.username=${SMARTCARE_MAIL_USERNAME:}
spring.mail.password=${SMARTCARE_MAIL_PASSWORD:}

smartcare.notifications.email-enabled=true
smartcare.notifications.whatsapp-enabled=${SMARTCARE_WHATSAPP_ENABLED:false}

spring.h2.console.enabled=false
spring.thymeleaf.cache=true
