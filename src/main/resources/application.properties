spring.application.name=SmartCare360

# Server Port
server.port=8080

# ============================================================
# SmartCare 360 Admin Bootstrap (override via env vars in production)
# ============================================================
smartcare.admin.email=${SMARTCARE_ADMIN_EMAIL:admin@smartcare360.com}
smartcare.admin.password=${SMARTCARE_ADMIN_PASSWORD:Admin@360}
smartcare.admin.name=${SMARTCARE_ADMIN_NAME:System Administrator}
smartcare.admin.mobile=${SMARTCARE_ADMIN_MOBILE:9999999999}

# ============================================================
# Database — H2 in-memory (default for dev/cloud)
# ============================================================
spring.datasource.url=jdbc:h2:mem:smartcare360;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Alternative: MySQL (uncomment for local Eclipse/MySQL setup)
# ============================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/hospitaldb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable legacy schema.sql / data.sql — JPA + DataInitializer manage schema & seed data
spring.sql.init.mode=never

# Thymeleaf Cache (disable during dev)
spring.thymeleaf.cache=false

# Mail Sender Configuration (fallback handling in EmailService)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMARTCARE_MAIL_USERNAME:}
spring.mail.password=${SMARTCARE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
