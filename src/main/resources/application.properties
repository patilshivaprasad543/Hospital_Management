spring.application.name=Hospital__Management

server.port=${PORT:8085}

# Database configuration: defaults to MySQL (fallback to H2 file database if DB_URL is not set)
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Performance & Connection Pool Optimizations (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Web Server Gzip Compression for fast page loading
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# SMTP Configuration with Environment Overrides & Fast Timeouts
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=4000
spring.mail.properties.mail.smtp.timeout=4000
spring.mail.properties.mail.smtp.writetimeout=4000

# Admin Account Configuration
smartcare.admin.name=${ADMIN_NAME:System Admin}
smartcare.admin.email=${ADMIN_EMAIL:admin@hospital.com}
smartcare.admin.password=${ADMIN_PASSWORD:Admin@123}
smartcare.admin.mobile=${ADMIN_MOBILE:9876543210}
 
# File Storage Directory
file.upload-dir=${UPLOAD_DIR:uploads}