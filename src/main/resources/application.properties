spring.application.name=SmartCare360

# dev = local defaults | prod = requires env vars (see application-prod.properties)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Port
server.port=${PORT:8080}

spring.datasource.url=${SMARTCARE_DB_URL:jdbc:h2:file:./data/smartcare360;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SMARTCARE_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${SMARTCARE_DB_USERNAME:sa}
spring.datasource.password=${SMARTCARE_DB_PASSWORD:}
spring.h2.console.enabled=false

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=${SMARTCARE_DB_DIALECT:org.hibernate.dialect.H2Dialect}

# schema.sql is reference documentation; Hibernate manages live schema via ddl-auto=update
spring.sql.init.mode=never

# Mail Sender Configuration (fallback handling in EmailService)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMARTCARE_MAIL_USERNAME:}
spring.mail.password=${SMARTCARE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Email provider: smtp (local/Gmail) or brevo (HTTPS API — required on Render free tier)
smartcare.mail.provider=${SMARTCARE_MAIL_PROVIDER:auto}
smartcare.mail.brevo.api-key=${SMARTCARE_BREVO_API_KEY:}
smartcare.mail.brevo.sender-email=${SMARTCARE_BREVO_SENDER_EMAIL:}
smartcare.mail.brevo.sender-name=${SMARTCARE_BREVO_SENDER_NAME:SmartCare 360}

# ============================================================
# Notification Channels
# ============================================================
smartcare.app.base-url=${SMARTCARE_APP_URL:http://localhost:8080}
smartcare.notifications.email-enabled=true
smartcare.notifications.whatsapp-enabled=${SMARTCARE_WHATSAPP_ENABLED:false}
smartcare.otp.expiry-minutes=10

# WhatsApp via Twilio (set SMARTCARE_WHATSAPP_ENABLED=true and Twilio credentials in production)
smartcare.whatsapp.enabled=${SMARTCARE_WHATSAPP_ENABLED:false}
smartcare.whatsapp.account-sid=${TWILIO_ACCOUNT_SID:}
smartcare.whatsapp.auth-token=${TWILIO_AUTH_TOKEN:}
smartcare.whatsapp.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
