spring.application.name=SmartCare360

# Server Port
server.port=8080

# ============================================================
# SmartCare 360 Admin Bootstrap (override via env vars in production)
# ============================================================
smartcare.admin.email=${SMARTCARE_ADMIN_EMAIL:admin@smartcare360.com}
smartcare.admin.password=${SMARTCARE_ADMIN_PASSWORD:Admin@360}
smartcare.admin.name=${SMARTCARE_ADMIN_NAME:System Administrator}
smartcare.admin.mobile=${SMARTCARE_ADMIN_MOBILE:9999999999}

# ============================================================
# Database — persistent file-based H2 (default)
# Override with MySQL via SMARTCARE_DB_URL env var
# ============================================================
spring.datasource.url=${SMARTCARE_DB_URL:jdbc:h2:file:./data/smartcare360;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SMARTCARE_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${SMARTCARE_DB_USERNAME:sa}
spring.datasource.password=${SMARTCARE_DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Alternative: MySQL (set SMARTCARE_DB_URL, SMARTCARE_DB_DRIVER, credentials)
# Example:
# SMARTCARE_DB_URL=jdbc:mysql://localhost:3306/smartcare360?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# SMARTCARE_DB_DRIVER=com.mysql.cj.jdbc.Driver
# SMARTCARE_DB_USERNAME=root
# SMARTCARE_DB_PASSWORD=your_password
# ============================================================

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=${SMARTCARE_DB_DIALECT:org.hibernate.dialect.H2Dialect}

# schema.sql is reference documentation; Hibernate manages live schema via ddl-auto=update
spring.sql.init.mode=never

# Thymeleaf Cache (disable during dev)
spring.thymeleaf.cache=false

# Mail Sender Configuration (fallback handling in EmailService)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMARTCARE_MAIL_USERNAME:}
spring.mail.password=${SMARTCARE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# Notification Channels
# ============================================================
smartcare.app.base-url=${SMARTCARE_APP_URL:http://localhost:8080}
smartcare.notifications.email-enabled=true
smartcare.notifications.whatsapp-enabled=true
smartcare.otp.expiry-minutes=10
smartcare.dev.expose-otp=${SMARTCARE_DEV_EXPOSE_OTP:true}

# WhatsApp via Twilio (set SMARTCARE_WHATSAPP_ENABLED=true and Twilio credentials in production)
smartcare.whatsapp.enabled=${SMARTCARE_WHATSAPP_ENABLED:false}
smartcare.whatsapp.account-sid=${TWILIO_ACCOUNT_SID:}
smartcare.whatsapp.auth-token=${TWILIO_AUTH_TOKEN:}
smartcare.whatsapp.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
