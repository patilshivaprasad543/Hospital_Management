spring.application.name=Hospital__Management

# The hosting platform supplies PORT. Local development falls back to 8085.
server.port=${PORT:8085}
server.address=0.0.0.0

# Neon connection: set JDBC_DATABASE_URL to the complete JDBC URL from Neon,
# e.g. jdbc:postgresql://<host>/<database>?sslmode=require&channel_binding=require.
# Local development falls back to a local PostgreSQL database.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/hospital_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=4000
spring.mail.properties.mail.smtp.timeout=4000
spring.mail.properties.mail.smtp.writetimeout=4000

smartcare.mail.provider=${MAIL_PROVIDER:${SMARTCARE_MAIL_PROVIDER:auto}}
smartcare.mail.brevo.api-key=${BREVO_API_KEY:${SMARTCARE_BREVO_API_KEY:}}
smartcare.mail.brevo.sender-email=${BREVO_SENDER_EMAIL:${SMARTCARE_BREVO_SENDER_EMAIL:}}
smartcare.mail.brevo.sender-name=${BREVO_SENDER_NAME:${SMARTCARE_BREVO_SENDER_NAME:SmartCare 360}}

smartcare.admin.name=${ADMIN_NAME:${SMARTCARE_ADMIN_NAME:System Admin}}
smartcare.admin.email=${ADMIN_EMAIL:${SMARTCARE_ADMIN_EMAIL:admin@hospital.com}}
smartcare.admin.password=${ADMIN_PASSWORD:${SMARTCARE_ADMIN_PASSWORD:Admin@123}}
smartcare.admin.mobile=${ADMIN_MOBILE:${SMARTCARE_ADMIN_MOBILE:9876543210}}

file.upload-dir=${UPLOAD_DIR:uploads}
smartcare.app.base-url=${SMARTCARE_APP_URL:http://localhost:8085}
smartcare.whatsapp.enabled=${SMARTCARE_WHATSAPP_ENABLED:false}
